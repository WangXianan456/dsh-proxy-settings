name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Verify the packed file list
        shell: bash
        run: |
          npm pack --dry-run --json > packed.json
          node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync("packed.json", "utf8").replace(/^\uFEFF/, "");
            const packed = JSON.parse(text)[0];
            const files = packed.files.map((file) => file.path);
            const required = [
              "package.json", "cordis.patch.yml", "README.md", "README.en.md", "LICENSE",
              "lib/index.js", "lib/client.js", "locale/en.json", "locale/zh.json", "icon.svg",
            ];
            const missing = required.filter((name) => !files.includes(name));
            if (missing.length > 0) {
              console.error("missing from the package: " + missing.join(", "));
              process.exit(1);
            }
            console.log("packed files: " + files.length + ", unpacked bytes: " + packed.unpackedSize);
          '
